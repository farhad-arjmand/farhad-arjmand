name: Refresh profile visuals
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate public statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_cards.py
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: farhad-arjmand
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%23d946ef
      - name: Publish generated images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/languages.svg assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public profile visualizations'
          gh auth setup-git
          git push origin HEAD:main
